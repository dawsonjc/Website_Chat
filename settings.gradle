pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'org.podval.tools.scalajs' version '0.9.14'
    }
}

rootProject.name = 'Website_Chat'

include ':scala_js', ':frontend', ':backend', ':auth_service:kt_service'

project(':auth_service:kt_service').projectDir = file('auth_service/kt_service')